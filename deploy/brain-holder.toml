# This service's standing line in every agent's brain: when to reach for it. How its tools are called is
# their manuals', handed with a tool's first call in a session.
held_by = "calendar"

[[memory]]
key = "when"
type = "tip"
recall_condition = "a reminder, an event or a meeting room booking"
text = "Use bmo/calendar_*; set an alarm when asked to be reminded, and find a free room before calendar_book."
