[package]
name = "calendar-tool"
description = "The calendar tool for the tool host: the events of a realm read, added, changed and cancelled in a turn."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "calendar-tool"
path = "src/main.rs"
test = false

[dependencies]
# The local now a reading of the next events starts from, and an end an hour or a day after a start.
chrono.workspace = true
# The calls to the calendar service.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# The stand-in calendar service the entries are tested against.
axum.workspace = true
# The manifest, read by the test of the entries it declares.
toml.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
