# Generated from bmo-app.toml by bmo-app-sdk's bmo-app-declare.
# Change the manifest and run `bmo-app-declare bmo-app.toml` again; do not hand-edit this file.

testbed = 0
name = "bmo-calendar"

# The shared base whose generator and skeletons this repository stands on.
upstreams = ["bmo-app-sdk"]

[test]
languages = ["cargo", "bun"]

[projects]
# The console bundle is a project of its own, its manifest and lockfile outside any package workspace.
paths = ["client"]

# The tool the service places on the tool host.
[tools]
dir = "tools"

[check]
# The sweeps that read the tree before anything runs.
quick = ["layout", "dependencies", "cargo-profile", "shared-versions"]
# The base library the service crate takes by a path beside this checkout.
base_libraries = ["bmo-app-service", "bmo-chat", "bmo-chat-client", "bmo-console-face", "bmo-ui"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

[build]
binaries = ["bmo-calendar", "calendar-tool"]

# The service's deploy tree and its data, kept apart from every release.
[deploy]
root = "~/.local/share/bmo-calendar"
link = "deploy"
data_root = "~/.local/share/bmo/data"
# The deployed settings each release links beside its own.
env_links = [{ link = "settings.local.toml", target = "env/calendar.toml" }]
units = ["deploy/*.service"]
health = "~/.local/share/bmo-calendar/deploy/bin/bmo-calendar health"

# The console bundle the service serves from the release: its locked packages laid
# and its folder built inside the release, where the settings' console folder reads it.
[[deploy.step]]
id = "console-bundle"
phase = "before-flip"
command = '''
set -eu
cd client
bun install --frozen-lockfile
bun run bundle
'''

# The env file the tool and the other units read the service's address and token from.
[[deploy.step]]
id = "tool-env"
phase = "before-flip"
command = "bin/bmo-calendar tool-env"

# The tool placed in its folder's .placed/, the folder the tool host reads: the executable
# the release's bin/ holds, its manifest, its manual and the schemas beside it.
[[deploy.step]]
id = "place-calendar-tool"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/calendar/.placed
mkdir -p tools/calendar/.placed
cp bin/calendar-tool tools/calendar/tool.toml tools/calendar/manual.md tools/calendar/*.json tools/calendar/.placed/
'''

# The placed tool registered with the tool host under this service's name, carrying the
# capability its entries ask for.
[[deploy.step]]
id = "register-calendar-tool"
phase = "after-health"
command = '''
set -eu
bmo pocket put tools/calendar/.placed --placed --service calendar --allow room.tools
'''

# This service's standing line in every agent's brain, declared once the service is up (the brain's
# docs/boundary-api.md, 「Declarations and holders」); a machine with no brain passes.
[[deploy.step]]
id = "holder-declare"
phase = "after-health"
command = '''
set -eu
brain="$HOME/.local/share/bmo-brain/deploy/bin/bmo-brain"
[ -x "$brain" ] || exit 0
"$brain" holder declare deploy/brain-holder.toml
'''
