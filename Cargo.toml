# The workspace: the calendar service's own package at the root, which also holds the checks that span the
# repository in `tests/`, and the tool it places on the tool host under `tools/calendar`. The console bundle
# under `client/` is a project of its own.
[workspace]
members = ["tools/calendar"]
resolver = "3"

[workspace.package]
version = "0.1.0-rev.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rust-ini = "0.21"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[package]
name = "bmo-calendar"
description = "The calendar service: dated events kept as memories in the brain, shown in the console and told to the supervisor when due."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[lib]
test = false

[[bin]]
name = "bmo-calendar"
path = "src/main.rs"
test = false

[dependencies]
# The routes the service answers on.
axum.workspace = true
# Local datetimes, the host's time zone, and the repeating events' months and days.
chrono.workspace = true
# The binary's command line.
clap.workspace = true
# The settings: the built-in defaults, the deployment's files and the environment, layered in that order.
config.workspace = true
# The brain's event stream, read as it comes, and the service's own.
futures-util.workspace = true
# The calls to the brain, the receiver and the account service.
reqwest.workspace = true
# The told marks, one SQLite file.
rusqlite.workspace = true
# The JSON Schemas of the wire types, for the OpenAPI document.
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# The names the console bundle's module and stylesheet are answered under, which follow their bytes.
sha2.workspace = true
tokio.workspace = true
# The peers' settings files under the data root.
toml.workspace = true

[dev-dependencies]
# The personal-data forms the repository's check reads.
regex.workspace = true
# The service's unit file, read in its INI shape by the repository's checks.
rust-ini.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

# Build output kept small: line tables alone for a backtrace, split out, and no incremental cache.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
debug = false
strip = "debuginfo"
